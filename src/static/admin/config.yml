backend:
  name: github
  repo: AmmarMetaphor/Inovantage-website
  branch: main
  use_graphql: true

local_backend: true
publish_mode: editorial_workflow
site_url: https://inovantage.co.uk
display_url: https://inovantage.co.uk
logo_url: https://inovantage.co.uk/assets/images/inovantage-logo-full.webp
show_preview_links: true
locale: en

media_folder: "src/static/assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "insights"
    label: "Insights"
    label_singular: "Insight post"
    folder: "src/content/posts"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    identifier_field: "slug"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title", "category"]
    view_filters:
      - label: "AI automation"
        field: "category"
        pattern: "AI Automation"
      - label: "Website design"
        field: "category"
        pattern: "Website Design"
      - label: "Social media"
        field: "category"
        pattern: "Social Media"
      - label: "App development"
        field: "category"
        pattern: "App Development"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "Clear, useful and specific. Aim for 45–65 characters."
      - label: "URL slug"
        name: "slug"
        widget: "string"
        hint: "Lowercase words separated by hyphens, for example: automate-customer-enquiries"
        pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use lowercase letters, numbers and hyphens only."]
      - label: "Publish date"
        name: "date"
        widget: "datetime"
        date_format: "DD MMMM YYYY"
        time_format: false
        format: "YYYY-MM-DD"
      - label: "Last updated"
        name: "updated"
        widget: "datetime"
        required: false
        date_format: "DD MMMM YYYY"
        time_format: false
        format: "YYYY-MM-DD"
      - label: "Search description"
        name: "description"
        widget: "text"
        hint: "A plain-English summary for search results and social sharing. Aim for 120–160 characters."
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "AI Automation"
          - "Website Design"
          - "Social Media"
          - "App Development"
          - "Digital Growth"
      - label: "Author"
        name: "author"
        widget: "string"
        default: "Inovantage"
      - label: "Featured image"
        name: "image"
        widget: "image"
        required: false
        hint: "Recommended: 1600 × 900 pixels, compressed JPG or WebP."
      - label: "Featured image alternative text"
        name: "imageAlt"
        widget: "string"
        required: false
        hint: "Describe what the image shows for people using screen readers."
      - label: "Feature on the site"
        name: "featured"
        widget: "boolean"
        default: false
        required: false
      - label: "Article"
        name: "body"
        widget: "markdown"

  - name: "settings"
    label: "Site settings"
    files:
      - label: "Business details"
        name: "business"
        file: "src/data/site.json"
        format: "json"
        fields:
          - { label: "Brand name", name: "name", widget: "string" }
          - { label: "Legal company name", name: "legalName", widget: "string", hint: "The full registered legal name, for example: INOVANTAGE LTD" }
          - { label: "Company number", name: "companyNumber", widget: "string", required: false }
          - { label: "Place of registration", name: "placeOfRegistration", widget: "string", required: false, hint: "Internal field only. Not shown on public pages until this wording is confirmed." }
          - { label: "Website URL", name: "url", widget: "string" }
          - { label: "Domain", name: "domain", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Contact email", name: "email", widget: "string" }
          - { label: "Telephone", name: "phone", widget: "string", required: false }
          - { label: "Service area", name: "location", widget: "string", hint: "Public-facing service area text, for example: Serving businesses across the United Kingdom and the United States" }
          - { label: "Registered office — street", name: "addressStreet", widget: "string", required: false }
          - { label: "Registered office — town/city", name: "addressLocality", widget: "string", required: false }
          - { label: "Registered office — county/region", name: "addressRegion", widget: "string", required: false }
          - { label: "Registered office — postcode", name: "addressPostcode", widget: "string", required: false }
          - { label: "Registered office — country code", name: "addressCountry", widget: "string", required: false, hint: "ISO country code, for example: GB" }
          - { label: "LinkedIn URL", name: "linkedin", widget: "string", required: false }
          - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
          - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
          - { label: "X URL", name: "x", widget: "string", required: false }
          - { label: "WhatsApp number", name: "whatsapp", widget: "string", required: false, hint: "Digits only, with country code, for example: 447375803774. Leave blank to hide the WhatsApp icon." }

  - name: "case_studies"
    label: "Case studies"
    files:
      - label: "Case studies, testimonials and clients"
        name: "case_studies_data"
        file: "src/data/case-studies.json"
        format: "json"
        description: >-
          Only publish a client story once that client has approved the wording,
          the figures and the permission to be named. Leave a field blank rather
          than estimating it. The Case Studies page renders whatever is here and
          shows an honest empty state while the lists are empty.
        fields:
          - label: "Case studies"
            name: "caseStudies"
            widget: "list"
            required: false
            label_singular: "Case study"
            summary: "{{fields.client}} — {{fields.title}}"
            fields:
              - { label: "URL slug", name: "slug", widget: "string", pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Use lowercase letters, numbers and hyphens only."], hint: "Becomes /case-studies/<slug>/" }
              - { label: "Client or company name", name: "client", widget: "string", hint: "Exactly as the client has agreed to be named." }
              - { label: "Project title", name: "title", widget: "string" }
              - label: "Service category"
                name: "category"
                widget: "select"
                options:
                  - { label: "AI Automation", value: "ai-automation" }
                  - { label: "Website Development", value: "website-development" }
                  - { label: "Social Media Management", value: "social-media-management" }
                  - { label: "App Development", value: "app-development" }
              - { label: "Summary", name: "summary", widget: "text", hint: "One or two sentences for the card and search results." }
              - { label: "Feature on the Case Studies page", name: "featured", widget: "boolean", default: true, required: false }
              - { label: "Project image", name: "image", widget: "image", required: false }
              - { label: "Image alternative text", name: "imageAlt", widget: "string", required: false }
              - { label: "The challenge", name: "challenge", widget: "text", required: false }
              - { label: "What we built", name: "built", widget: "text", required: false }
              - { label: "How it worked", name: "howItWorked", widget: "text", required: false }
              - { label: "The outcome", name: "result", widget: "text", required: false, hint: "Qualitative outcomes are fine. Never estimate a figure." }
              - label: "Verified metrics"
                name: "metrics"
                widget: "list"
                required: false
                label_singular: "Metric"
                summary: "{{fields.value}} {{fields.label}}"
                fields:
                  - { label: "Value", name: "value", widget: "string", hint: "Only a figure the client has confirmed, for example: 12 hours a week" }
                  - { label: "What it measures", name: "label", widget: "string" }
              - label: "Client testimonial"
                name: "testimonial"
                widget: "object"
                required: false
                collapsed: true
                fields:
                  - { label: "Quote", name: "quote", widget: "text", required: false, hint: "The client's own wording. Do not rewrite it." }
                  - { label: "Author", name: "author", widget: "string", required: false }
                  - { label: "Role", name: "role", widget: "string", required: false }
                  - { label: "Company", name: "company", widget: "string", required: false }
          - label: "Standalone testimonials"
            name: "testimonials"
            widget: "list"
            required: false
            label_singular: "Testimonial"
            summary: "{{fields.author}}"
            fields:
              - { label: "Quote", name: "quote", widget: "text", hint: "The client's own wording. Do not rewrite it." }
              - { label: "Author", name: "author", widget: "string" }
              - { label: "Role", name: "role", widget: "string", required: false }
              - { label: "Company", name: "company", widget: "string", required: false }
          - label: "Clients"
            name: "clients"
            widget: "list"
            required: false
            label_singular: "Client"
            summary: "{{fields.name}}"
            fields:
              - { label: "Company name", name: "name", widget: "string" }
              - { label: "Logo", name: "logo", widget: "image", required: false, hint: "Leave blank to show the company name as text. Never substitute another company's logo." }
