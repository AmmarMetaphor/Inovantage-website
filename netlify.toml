[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# The Services page became Solutions. These match the exact paths only, so the
# individual service routes under /services/ are untouched and keep working.
[[redirects]]
  from = "/services"
  to = "/solutions/"
  status = 301

[[redirects]]
  from = "/services/"
  to = "/solutions/"
  status = 301

# /work/ held the placeholder project examples that the Case Studies page now
# replaces, so it points there rather than at the service catalogue.
[[redirects]]
  from = "/work"
  to = "/case-studies/"
  status = 301

[[redirects]]
  from = "/work/"
  to = "/case-studies/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
